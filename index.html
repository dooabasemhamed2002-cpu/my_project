<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل الجامعات في السودان | حسب الولايات</title>
  <style>
    /* ===== المتغيرات ===== */
    :root {
      --primary: #1e6b3a;
      --primary-light: #2e8b57;
      --secondary: #c8a951;
      --dark: #1a1a2e;
      --light: #f4f7f4;
      --gray: #6c757d;
      --card-bg: #ffffff;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* ===== الهيدر ===== */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -60%;
      left: -10%;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 50%;
    }

    header h1 {
      font-size: 2.6rem;
      margin-bottom: 0.5rem;
      position: relative;
      z-index: 1;
    }

    header h1 span {
      color: var(--secondary);
    }

    header p {
      font-size: 1.15rem;
      opacity: 0.9;
      max-width: 650px;
      margin: 0 auto 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* ===== شريط البحث ===== */
    .search-box {
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .search-box input {
      width: 100%;
      padding: 0.9rem 1.2rem 0.9rem 3rem;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      transition: var(--transition);
    }

    .search-box input:focus {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      transform: scale(1.02);
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      pointer-events: none;
    }

    /* ===== إحصائيات ===== */
    .stats {
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding: 2rem 1.5rem;
      background: #fff;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item .number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      display: block;
    }

    .stat-item .label {
      font-size: 0.9rem;
      color: var(--gray);
    }

    /* ===== حاوية الولايات ===== */
    .states-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .state-section {
      margin-bottom: 2.5rem;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .state-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 3px solid var(--primary);
    }

    .state-header .icon {
      font-size: 1.8rem;
      background: var(--primary);
      color: #fff;
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .state-header h2 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .state-header .count {
      margin-right: auto;
      background: var(--secondary);
      color: var(--dark);
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* ===== شبكة الجامعات ===== */
    .uni-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .uni-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.2rem 1.3rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      transition: var(--transition);
      border-right: 4px solid var(--primary);
      position: relative;
      overflow: hidden;
    }

    .uni-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(30, 107, 58, 0.04));
      transition: var(--transition);
    }

    .uni-card:hover::before {
      width: 100%;
    }

    .uni-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .uni-card .uni-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
      margin-top: 0.2rem;
    }

    .uni-card .uni-info h3 {
      font-size: 1.05rem;
      color: var(--dark);
      margin-bottom: 0.3rem;
      line-height: 1.4;
    }

    .uni-card .uni-info .city {
      font-size: 0.85rem;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .uni-card .uni-info .city::before {
      content: '📍';
      font-size: 0.8rem;
    }

    .uni-card .uni-info .type {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.75rem;
      padding: 0.15rem 0.6rem;
      border-radius: 10px;
      font-weight: bold;
    }

    .type.public {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .type.private {
      background: #fff3e0;
      color: #e65100;
    }

    .type.tech {
      background: #e3f2fd;
      color: #1565c0;
    }

    /* ===== لا نتائج ===== */
    .no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--gray);
      font-size: 1.2rem;
      display: none;
    }

    .no-results .emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }

    /* ===== الفوتر ===== */
    footer {
      background: var(--dark);
      color: #fff;
      text-align: center;
      padding: 2.5rem 1.5rem;
    }

    footer p {
      color: #aaa;
      font-size: 0.9rem;
    }

    footer .footer-brand {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--secondary);
      margin-bottom: 0.5rem;
    }

    /* ===== زر العودة للأعلى ===== */
    .back-to-top {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background: var(--primary);
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(30, 107, 58, 0.4);
      transition: var(--transition);
      opacity: 0;
      visibility: hidden;
      z-index: 999;
      border: none;
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
    }

    .back-to-top:hover {
      background: var(--primary-light);
      transform: translateY(-3px);
    }

    /* ===== استجابة الجوال ===== */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.9rem;
      }

      header p {
        font-size: 1rem;
      }

      .stats {
        gap: 1.5rem;
        padding: 1.5rem 1rem;
      }

      .stat-item .number {
        font-size: 1.5rem;
      }

      .state-header h2 {
        font-size: 1.2rem;
      }

      .state-header .icon {
        width: 40px;
        height: 40px;
        font-size: 1.3rem;
        border-radius: 10px;
      }

      .uni-grid {
        grid-template-columns: 1fr;
      }

      .uni-card .uni-info h3 {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

        ]
      },
      {

        universities: [

        ]
      },
      {

        icon: "🌅",
        universities: [

        ]
      }
    ];

    // ===== دالة تحديد نوع الجامعة =====
    function getTypeClass(type) {
      if (type === "حكومية") return "public";
      if (type === "خاصة") return "private";
      return "tech";
    }

    // ===== دالة عرض الجامعات =====
    function renderUniversities(filterText = "") {
      const container = document.getElementById('statesContainer');
      const noResults = document.getElementById('noResults');
      let totalUnis = 0;
      let totalStates = 0;
      let html = "";

      const searchTerm = filterText.trim().toLowerCase();

      universitiesData.forEach(stateData => {
        // فلترة الجامعات حسب البحث
        const filteredUnis = stateData.universities.filter(uni => {
          if (!searchTerm) return true;
          return uni.name.toLowerCase().includes(searchTerm) ||
                 uni.city.toLowerCase().includes(searchTerm) ||
                 stateData.state.toLowerCase().includes(searchTerm);
        });

        if (filteredUnis.length === 0) return;

        totalStates++;
        totalUnis += filteredUnis.length;

        html += `
          <div class="state-section">
            <div class="state-header">
              <div class="icon">${stateData.icon}</div>
              <h2>${stateData.state}</h2>
              <span class="count">${filteredUnis.length} جامعة</span>
            </div>
            <div class="uni-grid">
        `;

        filteredUnis.forEach(uni => {
          html += `
            <div class="uni-card">
              <div class="uni-icon">🎓</div>
              <div class="uni-info">
                <h3>${uni.name}</h3>
                <div class="city">${uni.city}</div>
                <span class="type ${getTypeClass(uni.type)}">${uni.type}</span>
              </div>
            </div>
          `;
        });

        html += `</div></div>`;
      });

      container.innerHTML = html;

      // إظهار/إخفاء رسالة "لا نتائج"
      if (totalUnis === 0) {
        noResults.style.display = 'block';
      } else {
        noResults.style.display = 'none';
      }

      // تحديث الإحصائيات
      document.getElementById('totalUnis').textContent = totalUnis;
      document.getElementById('totalStates').textContent = totalStates;
    }

    // ===== البحث =====
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      renderUniversities(e.target.value);
    });

    // ===== زر العودة للأعلى =====
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    });

    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ===== سنة الفوتر =====
    document.getElementById('year').textContent = new Date().getFullYear();

    // ===== عرض أولي =====
    renderUniversities();
  </script>
</body>
</html>
